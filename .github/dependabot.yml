version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check 0.9.9 accepts TypeScript ^5 || ^6, not TypeScript 7.
      # Revisit once the whole Astro/tooling stack supports TS 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
