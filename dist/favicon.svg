    <path d="M 20 40 Q 20 25 35 25 Q 50 25 50 40 Q 50 55 35 55 Q 20 55 20 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M 55 25 L 55 55 M 55 40 Q 55 40 70 40 Q 75 40 75 45 Q 75 50 70 50 L 55 50" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
