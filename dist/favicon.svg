      @media (prefers-color-scheme: dark) {
        .fg { fill: #f5f5f1; }
        .bg { fill: #0a0a0a; }
      }
      @media (prefers-color-scheme: light) {
        .fg { fill: #0a0a0a; }
        .bg { fill: #f5f5f1; }
      }
    </style>
  </defs>
  <rect class="bg" width="100" height="100"/>
  <g class="fg">
