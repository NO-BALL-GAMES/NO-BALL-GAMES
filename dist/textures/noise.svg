<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Procedural noise texture -->
  <defs>
    <filter id="feTurbulence">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" seed="2"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#1a1a1a" filter="url(#feTurbulence)" opacity="0.15"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
</svg>
