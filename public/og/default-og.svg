<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Default OG image: dark with Grime Art branding -->
  <defs>
    <pattern id="noise" patternUnits="userSpaceOnUse" width="4" height="4">
      <circle cx="1" cy="1" r="0.5" fill="rgba(255,255,255,0.03)"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#noise)"/>
  
  <!-- Accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#ffff00"/>
  
  <!-- Text -->
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#f5f5f1" letter-spacing="-2">
    CHARLIE BUSTER
  </text>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="48" fill="#999" letter-spacing="2">
    Grime Art / UK Street Artist
  </text>
  <text x="60" y="420" font-family="monospace" font-size="24" fill="#666" letter-spacing="1">
    Graffiti Kings London / Since 2011
  </text>
  
  <!-- Corner mark -->
  <g opacity="0.2">
    <path d="M 1100 550 L 1120 570 M 1120 550 L 1100 570" stroke="#ffff00" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
