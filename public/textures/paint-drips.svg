<svg viewBox="0 0 200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Paint drip texture -->
  <defs>
    <linearGradient id="drip1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffff00;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffff00;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="drip2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ff4444;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Yellow drips -->
  <path d="M 40 20 Q 35 100 40 200 Q 45 300 40 400" stroke="url(#drip1)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 100 30 Q 95 120 100 250 Q 105 380 100 500" stroke="url(#drip1)" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Red drips -->
  <path d="M 150 40 Q 145 140 150 280 Q 155 420 150 550" stroke="url(#drip2)" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
